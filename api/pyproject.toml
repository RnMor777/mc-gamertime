[project]
name = "mc-gamertime-api"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "mangum==0.22.0",
    "boto3==1.43.90",
    "bcrypt==5.0.0",
    "httpx==0.28.1",
    "python-ulid==4.0.1",
    "pillow>=12.3.0",
    "pydantic==2.13.5",
    "starlette==1.6.0",
    "anyio==4.15.1",
    "cryptography==50.0.1",
    "defusedxml==0.7.1",
    "slowapi==0.1.10",
    "prometheus-client==0.26.0",
    "pyjwt==2.14.0",
]

[dependency-groups]
dev = [
    "uvicorn==0.52.4",
    "pytest",
    "pytest-mock",
    "ruff>=0.16.6",
    "moto[dynamodb]>=5.2.3",
    "pytest-cov>=7.1.0",
    "ty>=0.0.79",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# B = bugbear, UP = pyupgrade, SIM = simplify, C4 = comprehensions, PERF = perflint,
# RUF = ruff-specific, PT = pytest style, S = bandit (security), T20 = no stray print,
# ASYNC = blocking calls in async code (on top of pycodestyle/pyflakes/isort)
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PERF", "RUF", "PT", "S", "T20", "ASYNC"]
# E501: formatter owns line length. RUF001: en dashes etc. in user-facing strings are content.
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest asserts. S105/S106: test fixtures hold dummy secrets. S603/S607: tests
# invoke repo scripts by name on purpose.
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]
# Admin CLIs talk to the operator via print.
"scripts/*" = ["T201"]
# Table names come from config (`self._name`), never from request data; every
# value is a bound parameter.
"lib/db/sqlite_backend.py" = ["S608"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "scripts/*", "dist/*", ".venv/*", "handlers/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
# Floor, not a target: currently ~93%. Raise as coverage grows, never lower.
fail_under = 90

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
