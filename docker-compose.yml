services:
  mc-gamertime:
    container_name: mc-gamertime
    image: ghcr.io/strandgaard96/mc-gamertime:latest
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # APP_BIND=127.0.0.1 (default) keeps the port loopback-only for a reverse proxy on
      # this host; APP_BIND=0.0.0.0 exposes it to the LAN. Docker port bindings bypass
      # ufw/firewalld, so this line is the only firewall the app has.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-4263}:4263"
    environment:
      DB_BACKEND: sqlite
      STORAGE_BACKEND: local
      SECRETS_PROVIDER: env
      ORIGIN_GUARD_ENABLED: "false"
      PUBLIC_RECOMMENDED_ENABLED: "false"
      BGG_TOKEN: ${BGG_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DISABLE_LOCAL_AUTH: ${DISABLE_LOCAL_AUTH:-}
      OIDC_ENABLED: ${OIDC_ENABLED:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_ADMIN_EMAILS: ${OIDC_ADMIN_EMAILS:-}
      RULEBOOKS_STORAGE_DIR: ${RULEBOOKS_STORAGE_DIR:-/data/rulebooks}
    volumes:
      - ./config/app:/data
      - ./config/rulebooks:/data/rulebooks
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 128m
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
